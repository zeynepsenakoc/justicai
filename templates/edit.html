<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dilekçe Düzenle - JusticAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark mb-5" style="background-color: var(--primary);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo" style="height: 40px; background: white; padding: 4px; border-radius: 6px; margin-right: 10px;">
        JusticAI | Editör
    </a>
    <a href="/dashboard" class="btn btn-outline-light btn-sm">İptal ve Dön</a>
  </div>
</nav>

<div class="container fade-in-up pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color: var(--primary);">Dilekçeyi Düzenle</h2>
                <p class="text-muted">Yapay zeka çıktısını ihtiyacınıza göre düzenleyebilirsiniz.</p>
            </div>

            <div class="card shadow-lg border-0">
                <div class="card-header bg-white py-3">
                    <span class="badge bg-primary">{{ petition.category }}</span>
                    <span class="text-muted small float-end">Son düzenleme: {{ petition.date_created.strftime('%d.%m.%Y') }}</span>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Dilekçe Metni</label>
                            <textarea name="content" class="form-control p-4" rows="20" 
                                      style="font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.6; border: 2px solid #e2e8f0;">{{ petition.content }}</textarea>
                            <div class="form-text text-muted"><i class="fas fa-info-circle"></i> Resmi dilekçe formatını bozmamaya özen gösteriniz.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="/dashboard" class="btn btn-outline-secondary px-4">Vazgeç</a>
                            <button type="submit" class="btn btn-success btn-lg px-5 shadow-sm">
                                <i class="fas fa-save me-2"></i> Değişiklikleri Kaydet
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
