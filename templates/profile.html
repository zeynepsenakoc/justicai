<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profilim - JusticAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark mb-5 shadow-sm" style="background-color: #0f172a;">
        <div class="container">
            <span class="navbar-brand mb-0 h1">JusticAI | Profil Ayarları</span>
            <a href="/" class="btn btn-outline-light btn-sm">Ana Sayfaya Dön</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} shadow-sm">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="mb-0 fw-bold text-primary">Kişisel Bilgilerim</h5>
                        <small class="text-muted">Bu bilgiler dilekçelerinize otomatik eklenecektir.</small>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">AD SOYAD</label>
                                <input type="text" name="full_name" class="form-control form-control-lg" 
                                       value="{{ user.full_name or '' }}" placeholder="Örn: Ahmet Yılmaz">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small text-secondary">T.C. KİMLİK NO</label>
                                <input type="text" name="tckn" class="form-control form-control-lg" 
                                       value="{{ user.tckn or '' }}" maxlength="11" placeholder="11 haneli numara">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small text-secondary">ADRES</label>
                                <textarea name="address" class="form-control" rows="3" 
                                          placeholder="Mahalle, Sokak, No, İlçe/İl">{{ user.address or '' }}</textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg shadow-sm">
                                    Bilgileri Kaydet
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
